spring.application.name=dreamGoblin
fastapi.baseUrl=${FASTAPI_BASE_URL:http://fastapi:8000}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Caddy 뒤에서 https 주소를 그대로 인식해야 같은 출처 요청이 CORS로 막히지 않는다
server.forward-headers-strategy=framework

# 데모 계정(비밀번호가 비면 만들지 않는다)
app.demo.user-id=${DEMO_USER_ID:demo}
app.demo.password=${DEMO_PASSWORD:}

# 로그인 세션 쿠키
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d
server.servlet.session.cookie.secure=true
